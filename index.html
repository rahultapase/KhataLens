<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photograph your udhaar khata. Gemma 4 reads it on this laptop and writes polite reminders." />
    <title>KhataLens</title>
  </head>
  <body>
    <header class="masthead">
      <h1>KhataLens</h1>
      <p class="tagline">Photo of your udhaar khata in, ledger and polite reminders out. All on this laptop.</p>
      <p id="gemma-status" class="status" role="status" aria-live="polite">Checking Gemma...</p>
    </header>

    <main id="app">
      <section class="panel" aria-labelledby="capture-title">
        <h2 id="capture-title">1. Photograph a khata page</h2>
        <div class="capture-actions">
          <label class="btn btn-secondary file-btn">
            <input id="photo-input" type="file" accept="image/*" capture="environment" class="visually-hidden" />
            <span>Take or choose photo</span>
          </label>
          <button id="sample-btn" type="button" class="btn btn-secondary">Try sample page</button>
        </div>
        <figure id="preview" class="preview" hidden>
          <img id="preview-img" alt="Selected khata page" />
          <figcaption id="preview-meta"></figcaption>
        </figure>
        <button id="read-btn" type="button" class="btn btn-primary" disabled>Read with Gemma</button>
        <p id="read-progress" class="progress" role="status" aria-live="polite" hidden></p>
        <div id="read-error" class="error" role="alert" hidden>
          <p id="read-error-msg"></p>
          <details id="read-error-raw-wrap" hidden>
            <summary>Show Gemma's raw answer</summary>
            <pre id="read-error-raw"></pre>
          </details>
        </div>
      </section>

      <section class="panel" aria-labelledby="extract-title">
        <h2 id="extract-title">Extracted entries</h2>
        <pre id="extract-json">Nothing read yet.</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
